<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">
          
          <meta name="_csrf" th:content="${_csrf.token}">
<meta name="_csrf_header" th:content="${_csrf.headerName}">

    <title>ChatApp - Chat</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Chat CSS -->
    <link rel="stylesheet"
          th:href="@{/css/chat.css}">

    <!-- SockJS -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>

    <!-- STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

</head>

<body>

<!-- ===================================================== -->
<!-- CHAT DATA -->
<!-- ===================================================== -->

<div id="chatData"
     th:data-chat-id="${chat.id}"
     th:data-current-user-id="${currentUser.id}">
</div>


<!-- ===================================================== -->
<!-- NAVBAR -->
<!-- ===================================================== -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container-fluid">

        <!-- BRAND -->
        <a class="navbar-brand fw-bold"
           th:href="@{/dashboard}">

            <i class="fa-solid fa-comments"></i>

            ChatApp

        </a>


        <!-- LOGOUT -->
        <form th:action="@{/logout}"
              method="post">

            <!-- CSRF -->
            <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}">

            <button
                type="submit"
                class="btn btn-danger btn-sm">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </button>

        </form>

    </div>

</nav>


<!-- ===================================================== -->
<!-- CHAT CONTAINER -->
<!-- ===================================================== -->

<div class="container-fluid chat-container">

    <div class="row h-100 justify-content-center">

        <div class="col-md-10 col-lg-8 p-0">

            <div class="chat-box">


                <!-- ================================================= -->
                <!-- CHAT HEADER -->
                <!-- ================================================= -->

                <div class="chat-header">

                    <div class="d-flex align-items-center">

                        <!-- BACK BUTTON -->

                        <a
                            th:href="@{/dashboard}"
                            class="btn btn-light me-3">

                            <i class="fa-solid fa-arrow-left"></i>

                        </a>


                        <!-- OTHER USER IMAGE -->

                        <img
                            th:src="@{'/images/' + ${otherUser.profileImage}}"
                            class="profile-image me-3"
                            alt="Profile">


                        <!-- OTHER USER DETAILS -->

                        <div>

                            <h5
                                class="mb-1"
                                th:text="${otherUser.name}">

                                User

                            </h5>


                            <!-- ONLINE STATUS -->

                            <small
                                id="userStatus"
                                class="text-muted">

                                <span
                                    class="online-dot"
                                    th:classappend="${otherUser.status == 'ONLINE'} ? ' online' : ' offline'">
                                </span>


                                <span
                                    id="statusText"
                                    th:if="${otherUser.status == 'ONLINE'}">

                                    Online

                                </span>


                                <span
                                    id="statusText"
                                    th:unless="${otherUser.status == 'ONLINE'}">

                                    Last seen

                                    <span
                                        th:text="${#temporals.format(otherUser.lastSeen, 'hh:mm a')}">
                                    </span>

                                </span>

                            </small>


                            <!-- TYPING INDICATOR -->

                            <div
                                id="typingIndicator"
                                class="text-primary small"
                                style="display: none;">

                                <span id="typingText"></span>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- ================================================= -->
                <!-- MESSAGES AREA -->
                <!-- ================================================= -->

                <div
                    class="messages"
                    id="messagesContainer">


                    <!-- NO MESSAGES -->

                    <div
                        th:if="${#lists.isEmpty(messages)}"
                        class="empty-chat text-center">

                        <div>

                            <i
                                class="fa-solid fa-comments fa-4x text-secondary">
                            </i>


                            <h4 class="mt-3">

                                Start a conversation

                            </h4>


                            <p class="text-muted">

                                Send a message to

                                <strong
                                    th:text="${otherUser.name}">

                                    User

                                </strong>

                            </p>

                        </div>

                    </div>


<!-- ================================================= -->
<!-- MESSAGE LIST -->
<!-- ================================================= -->

<div th:each="message : ${messages}"
     class="mb-3"
     th:attr="data-message-id=${message.id}">

    <!-- ================================================= -->
    <!-- MY MESSAGE -->
    <!-- ================================================= -->

    <div th:if="${message.sender.id == currentUser.id}"
         class="d-flex justify-content-end">

        <div class="bg-primary text-white p-2 px-3 rounded-3 message-bubble">

            <!-- =============================== -->
            <!-- IMAGE MESSAGE -->
            <!-- =============================== -->

            <div th:if="${message.messageType == 'IMAGE'}"
                 class="chat-image-container">

                <a th:href="@{${message.attachmentUrl}}"
                   target="_blank">

                    <img th:src="@{${message.attachmentUrl}}"
                         th:alt="${message.attachmentName}"
                         class="chat-image">
                </a>

                <!-- Optional caption -->
                <div th:if="${message.content != null and !#strings.isEmpty(message.content)}"
                     class="mt-1"
                     th:text="${message.content}">
                </div>

            </div>


            <!-- =============================== -->
            <!-- FILE MESSAGE -->
            <!-- =============================== -->

            <div th:if="${message.messageType == 'FILE'}"
                 class="chat-file-container">

                <a th:href="@{${message.attachmentUrl}}"
                   target="_blank"
                   class="chat-file-link text-white text-decoration-none">

                    <i class="fa-solid fa-file fa-2x me-2"></i>

                    <span th:text="${message.attachmentName}">
                        File
                    </span>

                    <i class="fa-solid fa-download ms-2"></i>

                </a>

            </div>


            <!-- =============================== -->
            <!-- NORMAL TEXT MESSAGE -->
            <!-- =============================== -->

            <div th:if="${message.messageType == 'TEXT'}"
                 class="message-text"
                 th:text="${message.content}">
                Message
            </div>


            <!-- =============================== -->
            <!-- TIME + STATUS -->
            <!-- =============================== -->

            <div class="message-meta">

                <small class="opacity-75"
                       th:text="${#temporals.format(message.sentAt, 'hh:mm a')}">
                    10:30 AM
                </small>

                <!-- STATUS -->
                <span class="message-status"
                      th:attr="data-message-id=${message.id}">

                    <span th:if="${message.deliveryStatus == 'SENT'}">
                        ✓
                    </span>

                    <span th:if="${message.deliveryStatus == 'DELIVERED'}">
                        ✓✓
                    </span>

                    <span th:if="${message.deliveryStatus == 'READ'}"
                          class="read-tick">
                        ✓✓
                    </span>

                </span>

            </div>

        </div>

    </div>


    <!-- ================================================= -->
    <!-- OTHER USER MESSAGE -->
    <!-- ================================================= -->

    <div th:unless="${message.sender.id == currentUser.id}"
         class="d-flex justify-content-start">

        <div class="bg-white border p-2 px-3 rounded-3 message-bubble">

            <!-- =============================== -->
            <!-- IMAGE MESSAGE -->
            <!-- =============================== -->

            <div th:if="${message.messageType == 'IMAGE'}"
                 class="chat-image-container">

                <a th:href="@{${message.attachmentUrl}}"
                   target="_blank">

                    <img th:src="@{${message.attachmentUrl}}"
                         th:alt="${message.attachmentName}"
                         class="chat-image">
                </a>

                <!-- Optional caption -->
                <div th:if="${message.content != null and !#strings.isEmpty(message.content)}"
                     class="mt-1"
                     th:text="${message.content}">
                </div>

            </div>


            <!-- =============================== -->
            <!-- FILE MESSAGE -->
            <!-- =============================== -->

            <div th:if="${message.messageType == 'FILE'}"
                 class="chat-file-container">

                <a th:href="@{${message.attachmentUrl}}"
                   target="_blank"
                   class="chat-file-link text-dark text-decoration-none">

                    <i class="fa-solid fa-file fa-2x me-2"></i>

                    <span th:text="${message.attachmentName}">
                        File
                    </span>

                    <i class="fa-solid fa-download ms-2"></i>

                </a>

            </div>


            <!-- =============================== -->
            <!-- NORMAL TEXT MESSAGE -->
            <!-- =============================== -->

            <div th:if="${message.messageType == 'TEXT'}"
                 class="message-text"
                 th:text="${message.content}">
                Message
            </div>


            <!-- =============================== -->
            <!-- TIME -->
            <!-- =============================== -->

            <small class="d-block text-end text-muted mt-1"
                   th:text="${#temporals.format(message.sentAt, 'hh:mm a')}">
                10:30 AM
            </small>

        </div>

    </div>

</div>




<!-- ================================================= -->
<!-- MESSAGE INPUT -->
<!-- ================================================= -->

<!-- ================================================= -->
<!-- MESSAGE INPUT -->
<!-- ================================================= -->

<div class="message-input">

    <!-- ================================================= -->
    <!-- ATTACHMENT PREVIEW -->
    <!-- ================================================= -->

    <div id="attachmentPreview"
         class="attachment-preview"
         style="display: none;">

        <!-- IMAGE PREVIEW -->
        <div id="imagePreviewContainer"
             class="image-preview-container"
             style="display: none;">

            <img id="imagePreview"
                 src=""
                 alt="Preview"
                 class="image-preview">

        </div>


        <!-- FILE PREVIEW -->
        <div id="filePreviewContainer"
             class="file-preview-container"
             style="display: none;">

            <i class="fa-solid fa-file"></i>

            <span id="fileNamePreview">
                File
            </span>

        </div>


        <!-- REMOVE ATTACHMENT -->
        <button type="button"
                id="removeAttachment"
                class="btn btn-sm btn-danger remove-attachment"
                title="Remove attachment">

            <i class="fa-solid fa-xmark"></i>

        </button>

    </div>


    <!-- ================================================= -->
    <!-- MESSAGE FORM -->
    <!-- ================================================= -->

    <form id="messageForm">

        <div class="input-group">


            <!-- ================================================= -->
            <!-- EMOJI BUTTON -->
            <!-- ================================================= -->

            <button
                type="button"
                class="btn btn-light emoji-button"
                id="emojiButton"
                title="Emoji">

                😊

            </button>


            <!-- ================================================= -->
            <!-- ATTACHMENT BUTTON -->
            <!-- ================================================= -->

            <button
                type="button"
                class="btn btn-light attachment-button"
                id="attachmentButton"
                title="Attach file">

                <i class="fa-solid fa-paperclip"></i>

            </button>


            <!-- ================================================= -->
            <!-- HIDDEN FILE INPUT -->
            <!-- ================================================= -->

            <input
                type="file"
                id="fileInput"
                style="display: none;"
                accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.zip,.rar">


            <!-- ================================================= -->
            <!-- MESSAGE INPUT -->
            <!-- ================================================= -->

            <input
                type="text"
                id="messageInput"
                class="form-control"
                placeholder="Type a message..."
                autocomplete="off">


            <!-- ================================================= -->
            <!-- SEND BUTTON -->
            <!-- ================================================= -->

            <button
                type="submit"
                class="btn btn-primary">

                <i class="fa-solid fa-paper-plane"></i>

                Send

            </button>

        </div>

    </form>


    <!-- ================================================= -->
    <!-- EMOJI PICKER -->
    <!-- ================================================= -->

    <div
        id="emojiPicker"
        class="emoji-picker">

        <div class="emoji-list">

            <button type="button" class="emoji">😀</button>
            <button type="button" class="emoji">😃</button>
            <button type="button" class="emoji">😄</button>
            <button type="button" class="emoji">😁</button>
            <button type="button" class="emoji">😆</button>
            <button type="button" class="emoji">😅</button>
            <button type="button" class="emoji">😂</button>
            <button type="button" class="emoji">🤣</button>
            <button type="button" class="emoji">😊</button>
            <button type="button" class="emoji">😇</button>
            <button type="button" class="emoji">🙂</button>
            <button type="button" class="emoji">😉</button>
            <button type="button" class="emoji">😍</button>
            <button type="button" class="emoji">🥰</button>
            <button type="button" class="emoji">😘</button>
            <button type="button" class="emoji">😎</button>
            <button type="button" class="emoji">🤩</button>
            <button type="button" class="emoji">🥳</button>

            <button type="button" class="emoji">😭</button>
            <button type="button" class="emoji">😢</button>
            <button type="button" class="emoji">😡</button>
            <button type="button" class="emoji">😱</button>
            <button type="button" class="emoji">😴</button>
            <button type="button" class="emoji">🤔</button>
            <button type="button" class="emoji">🙄</button>

            <button type="button" class="emoji">❤️</button>
            <button type="button" class="emoji">🧡</button>
            <button type="button" class="emoji">💛</button>
            <button type="button" class="emoji">💚</button>
            <button type="button" class="emoji">💙</button>
            <button type="button" class="emoji">💜</button>
            <button type="button" class="emoji">🖤</button>
            <button type="button" class="emoji">🤍</button>
            <button type="button" class="emoji">💯</button>

            <button type="button" class="emoji">👍</button>
            <button type="button" class="emoji">👎</button>
            <button type="button" class="emoji">👏</button>
            <button type="button" class="emoji">🙌</button>
            <button type="button" class="emoji">🙏</button>
            <button type="button" class="emoji">👌</button>
            <button type="button" class="emoji">✌️</button>
            <button type="button" class="emoji">🤝</button>
            <button type="button" class="emoji">💪</button>
            <button type="button" class="emoji">👋</button>

            <button type="button" class="emoji">🔥</button>
            <button type="button" class="emoji">⭐</button>
            <button type="button" class="emoji">✨</button>
            <button type="button" class="emoji">🎉</button>
            <button type="button" class="emoji">🎊</button>
            <button type="button" class="emoji">🚀</button>
            <button type="button" class="emoji">💡</button>
            <button type="button" class="emoji">🎯</button>
            <button type="button" class="emoji">🏆</button>

        </div>

    </div>

</div>
<!-- ===================================================== -->
<!-- CHAT JAVASCRIPT -->
<!-- ===================================================== -->

<script th:src="@{/js/chat.js}"></script>

</body>

</html>
